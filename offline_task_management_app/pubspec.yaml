name: offline_task_management_app
description: "Offline-first task management app (GDG Tech Wildcard Entry)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Backend (DBMS + Auth) ---
  supabase_flutter: ^2.16.0        # Postgres DB + GoTrue auth + session persistence
  google_sign_in: ^7.2.0           # Native Google account picker -> gives us an ID token

  # --- Functional error handling (domain layer stays exception-free) ---
  fpdart: ^1.1.1                   # Either<Failure, Success>
  equatable: ^2.0.7                # value equality for entities/failures/states

  # --- State management (presentation layer) ---
  flutter_bloc: ^9.1.1

  # --- Dependency injection ---
  get_it: ^8.2.0

  # --- Connectivity (needed for offline-first behaviour) ---
  internet_connection_checker_plus: ^2.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
